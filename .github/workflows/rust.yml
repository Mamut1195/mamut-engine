name: Rust

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: [self-hosted, contabo, engine]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Entorno aislado del job (HOME, CARGO_HOME y toolchain de solo lectura)
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/cargo-home"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-home"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
            echo "PATH=/opt/rust/bin:/usr/local/bin:/usr/bin:/bin"
            echo "RUSTUP_TOOLCHAIN="
          } >> "$GITHUB_ENV"
      - name: Verificar toolchain fijado (/opt/rust, Rust 1.99.0)
        run: |
          set -eu
          test "$(command -v rustc)" = /opt/rust/bin/rustc
          test "$(command -v cargo)" = /opt/rust/bin/cargo
          rustc -Vv
          rustc -V | grep -q '^rustc 1\.99\.0 '
          printf '%s  %s\n' \
            f3834d26669b03f6855fa54bd2381443123e860167bc0c7a8dd137e5cf6e5e4f /opt/rust/bin/rustc \
            e951141cc55a6cd7b9876d187bd30a3720e6086b99413af95e3b8de1cdd72f14 /opt/rust/bin/cargo \
            | sha256sum -c -
      - name: Changelog
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CHANGELOG_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'release') && '1' || '' }}
        run: bash scripts/changelog-check.sh "$BASE"
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test --workspace
      - name: Documentación
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --workspace
      - name: Compilación WebAssembly
        run: cargo check --workspace --target wasm32-unknown-unknown
      - name: Limpieza final (procesos sobrantes y RUNNER_TEMP)
        if: always()
        run: |
          # Kill processes owned by the runner user, except the runner itself and this shell.
          keep=" $$ $PPID "
          p=$PPID; while [ "$p" -gt 1 ]; do p=$(ps -o ppid= -p "$p" | tr -d ' '); keep="$keep$p "; done
          for pid in $(pgrep -u "$(id -u)"); do
            case "$keep" in *" $pid "*) continue ;; esac
            comm=$(ps -o comm= -p "$pid" 2>/dev/null) || continue
            case "$comm" in Runner.Listener|Runner.Worker|runsvc.sh|run.sh|run-helper.sh) continue ;; esac
            kill -9 "$pid" 2>/dev/null || true
          done
          find "$RUNNER_TEMP" -mindepth 1 -delete 2>/dev/null || true
