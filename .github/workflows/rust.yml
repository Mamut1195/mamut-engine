name: Rust

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Entorno aislado del job (HOME, CARGO_HOME y target)
        run: |
          set -euo pipefail
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          rustup_bin="$(command -v rustup)"
          rustup_home="$(realpath -e -- "${RUSTUP_HOME:-$HOME/.rustup}")"
          job_temp="$(mktemp -d "$runner_temp/public-ci-rust.XXXXXX")"
          echo "CI_JOB_TEMP=$job_temp" >> "$GITHUB_ENV"
          mkdir -p "$job_temp/home" "$job_temp/cargo-home" "$job_temp/target" "$job_temp/tmp"
          {
            echo "HOME=$job_temp/home"
            echo "CARGO_HOME=$job_temp/cargo-home"
            echo "CARGO_TARGET_DIR=$job_temp/target"
            echo "TMPDIR=$job_temp/tmp"
            echo "RUSTUP_HOME=$rustup_home"
            echo "RUSTUP_TOOLCHAIN=1.99.0"
          } >> "$GITHUB_ENV"
          # Preserve the hosted rustup proxies and state before changing HOME.
          # No credentials or configuration files are copied.
          dirname -- "$rustup_bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar y verificar Rust 1.99.0
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal \
            --component rustfmt --component clippy \
            --target wasm32-unknown-unknown
          rustc -Vv
          cargo -V
          rustc -V | grep -Eq '^rustc 1\.99\.0 '
          cargo -V | grep -Eq '^cargo 1\.99\.0 '
      - name: Changelog
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CHANGELOG_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'release') && '1' || '' }}
        run: bash scripts/changelog-check.sh "$BASE"
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test --workspace
      - name: Documentación
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --workspace
      - name: Compilación WebAssembly
        run: cargo check --workspace --target wasm32-unknown-unknown
      - name: Limpieza final del directorio temporal del job
        if: always()
        run: |
          set -euo pipefail
          if [[ -z "${CI_JOB_TEMP:-}" ]]; then exit 0; fi
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          job_temp="$(realpath -m -- "$CI_JOB_TEMP")"
          if [[ "$(dirname -- "$job_temp")" != "$runner_temp" ||
                "$(basename -- "$job_temp")" != public-ci-rust.* ]]; then
            echo "::error::Refusing cleanup outside this job's temporary directory."
            exit 1
          fi
          rm -rf -- "$job_temp"
