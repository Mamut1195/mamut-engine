name: Clean-room

# pull_request (not pull_request_target): PR code never runs with write permissions.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Entorno aislado del job (HOME, CARGO_HOME)
        run: |
          set -euo pipefail
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          job_temp="$(mktemp -d "$runner_temp/public-ci-clean-room.XXXXXX")"
          echo "CI_JOB_TEMP=$job_temp" >> "$GITHUB_ENV"
          mkdir -p "$job_temp/home" "$job_temp/cargo-home" "$job_temp/tmp"
          {
            echo "HOME=$job_temp/home"
            echo "CARGO_HOME=$job_temp/cargo-home"
            echo "TMPDIR=$job_temp/tmp"
          } >> "$GITHUB_ENV"
      # Trusted source: validator and lists from the BASE branch, in a separate directory.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Elegir validador confiable
        run: |
          if [ -f trusted-base/clean-room/check.sh ] && [ -f trusted-base/clean-room/tests/run.sh ]; then
            echo "TRUSTED=$GITHUB_WORKSPACE/trusted-base/clean-room" >> "$GITHUB_ENV"
          else
            # Bootstrap: the base has no validator yet. The PR validator is used; the
            # protected-review job requires owner approval for that change.
            echo "::warning::The base has no clean-room validator; using the PR validator (bootstrap)."
            echo "TRUSTED=$GITHUB_WORKSPACE/pr/clean-room" >> "$GITHUB_ENV"
          fi
      - name: Pruebas del validador
        run: bash "$TRUSTED/tests/run.sh" "$TRUSTED"
      - name: Check clean-room (validador y listas de la base)
        working-directory: pr
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash "$TRUSTED/check.sh" "$PR_BASE" "$TRUSTED"
      - name: Limpieza final del directorio temporal del job
        if: always()
        run: |
          set -euo pipefail
          if [[ -z "${CI_JOB_TEMP:-}" ]]; then exit 0; fi
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          job_temp="$(realpath -m -- "$CI_JOB_TEMP")"
          if [[ "$(dirname -- "$job_temp")" != "$runner_temp" ||
                "$(basename -- "$job_temp")" != public-ci-clean-room.* ]]; then
            echo "::error::Refusing cleanup outside this job's temporary directory."
            exit 1
          fi
          rm -rf -- "$job_temp"


  protected-review:
    # Fail if the PR touches clean-room/**, workflows, CODEOWNERS or docs/CLEAN_ROOM.md
    # without current owner approval (on the latest commit).
    # GitHub rejects self-approval: a PR authored by Mamut1195 cannot satisfy this gate.
    # A distinct authorized contributor's PR needs a real latest-head owner review.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Entorno aislado del job (HOME, CARGO_HOME)
        run: |
          set -euo pipefail
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          job_temp="$(mktemp -d "$runner_temp/public-ci-protected-review.XXXXXX")"
          echo "CI_JOB_TEMP=$job_temp" >> "$GITHUB_ENV"
          mkdir -p "$job_temp/home" "$job_temp/cargo-home" "$job_temp/tmp"
          {
            echo "HOME=$job_temp/home"
            echo "CARGO_HOME=$job_temp/cargo-home"
            echo "TMPDIR=$job_temp/tmp"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exigir revisión del dueño
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: Mamut1195
        run: |
          changed=$(git diff --no-ext-diff --no-renames --name-only -z "$PR_BASE" HEAD -- | tr '\0' '\n' | grep -E '^(clean-room/|\.github/workflows/|\.github/CODEOWNERS$|docs/CLEAN_ROOM\.md$)' || true)
          if [ -z "$changed" ]; then echo "No protected files changed."; exit 0; fi
          printf 'Changed protected files:\n%s\n' "$changed"
          ok=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate \
            --jq "[.[] | select(.state==\"APPROVED\" and .user.login==\"$OWNER\" and .commit_id==\"$PR_HEAD\")] | length")
          if [ "$(printf '%s\n' "$ok" | awk '{t+=$1} END{print t+0}')" -ge 1 ]; then echo "Approved by $OWNER."; exit 0; fi
          echo "::error::Changes to protected files without current approval from @$OWNER."
          exit 1
      - name: Limpieza final del directorio temporal del job
        if: always()
        run: |
          set -euo pipefail
          if [[ -z "${CI_JOB_TEMP:-}" ]]; then exit 0; fi
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          job_temp="$(realpath -m -- "$CI_JOB_TEMP")"
          if [[ "$(dirname -- "$job_temp")" != "$runner_temp" ||
                "$(basename -- "$job_temp")" != public-ci-protected-review.* ]]; then
            echo "::error::Refusing cleanup outside this job's temporary directory."
            exit 1
          fi
          rm -rf -- "$job_temp"
