[package]
name = "engine-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mamut-engine"
path = "src/main.rs"

[dependencies]
engine-api = { path = "../engine-api" }
mamut-workflow = { path = "../../vendor/mamut-workflows/mamut-workflow" }
mamut-workflow-cli = { path = "../../vendor/mamut-workflows/mamut-workflow-cli" }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
toml = { version = "=1.1.8+spec-1.1.0", default-features = false, features = ["std", "serde", "parse", "display"] }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "=0.4.5", default-features = false }
