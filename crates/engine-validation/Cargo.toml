[package]
name = "engine-validation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
engine-api = { path = "../engine-api" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[[example]]
name = "fixture_wasm"
crate-type = ["cdylib"]

[dev-dependencies]
engine-elements-frame3d = { path = "../engine-elements-frame3d" }
engine-geo = { path = "../engine-geo" }
engine-core = { path = "../engine-core" }
engine-contracts = { path = "../engine-contracts" }
engine-model = { path = "../engine-model" }
engine-linalg = { path = "../engine-linalg" }
engine-assembly = { path = "../engine-assembly" }
engine-elements-truss = { path = "../engine-elements-truss" }
engine-elements-frame = { path = "../engine-elements-frame" }
engine-analysis = { path = "../engine-analysis" }
