[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "mamut-engine"
dynamic = ["version"]
description = "Bindings Python nativos sobre la fachada engine-api de MAMUT Engine."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
# Licencia comercial disponible con MAMPRO SAS; texto legal pendiente (ENG-GOV-004).
# La publicación en PyPI requiere aprobación explícita de Jonathan.

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "mamut_engine._native"
python-source = "python"
# maturin 1.15.0: el SBOM portable se genera junto a la wheel.
sbom = { rust = false, auditwheel = false }
