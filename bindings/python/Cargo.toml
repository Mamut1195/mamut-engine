[package]
name = "mamut-engine-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
engine-api = { path = "../../crates/engine-api", version = "0.1.0" }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
pyo3 = { version = "=0.29.3", features = ["abi3-py310"] }
