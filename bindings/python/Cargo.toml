[package]
name = "mamut-engine-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
engine-core = { path = "../../crates/engine-core", version = "0.1.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "=0.25.1", features = ["abi3-py310"] }
