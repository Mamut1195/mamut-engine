# Modified for mamut-engine vendoring: literal metadata, local README, no publishing; see ../NOTICE.
[package]
name = "mamut-workflow-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.83"
repository = "https://github.com/Mamut1195/mamut-workflows"
description = "Reusable workflow CLI with engine, progress, and cancellation extension points."
readme = "../README.md"
publish = false

[dependencies]
mamut-workflow = { path = "../mamut-workflow" }
mamut-workflow-execution = { path = "../mamut-workflow-execution" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mamut-canon = { path = "../mamut-canon" }
